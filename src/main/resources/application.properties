# Disabilita la stampa del banner spring nei log
spring.main.banner-mode=off

# ------------ JSON SERIALIZATION & PRESENTATION-------------------

# Pattern date
spring.mvc.date-format=yyyy-MM-dd
spring.mvc.datetime-format=yyyy-MM-dd'T'HH:mm:ssZZZ
spring.mvc.throw-exception-if-no-handler-found=true

spring.jackson.default-property-inclusion=non_absent

server.error.whitelabel.enabled=true

# ------------ LOGGING (govpay-common) ------------------
# Transaction id e correlation id in ogni riga di log (BP-LOG-3), popolati dal
# TransactionIdFilter di govpay-common: il transaction id e' generato a ogni
# richiesta e non e' mai accettato dall'esterno, il correlation id e' letto da
# X-Correlation-ID / X-Request-ID (o generato) ed e' propagato alle chiamate
# downstream. Entrambi sono restituiti al client negli header di risposta.
logging.pattern.level=%5p [%X{transactionId:-},%X{correlationId:-}]

# Livelli di log modificabili a runtime (BP-LOG-1). La sorgente e' la riga
# log_level della tabella configurazione: una modifica scritta li' raggiunge
# tutti i nodi del cluster entro l'intervallo di refresh. /actuator/loggers da
# solo non basta, perche' agisce sul solo nodo interrogato.
govpay.logging.livelli-dinamici.enabled=true
govpay.logging.livelli-dinamici.intervallo-refresh=${LOG_LEVEL_REFRESH_INTERVAL:60s}
govpay.logging.livelli-dinamici.logger-gestiti[0]=it.govpay

# ------------ DATASOURCE & JPA ------------------
spring.datasource.url=${DATASOURCE_URL:}
spring.datasource.username=${DATASOURCE_USERNAME:}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.postgresql.Driver}

spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# -------------- CLUSTER ----------------
govpay.riconciliazioni.cluster-id=${CLUSTER_ID:riconciliazioni-api}

# -------------- AUTH (govpay-common-auth) ----------------
# BASIC abilitato (utenze locali). Gli altri metodi (SSL, SPID, OAUTH2, ...)
# restano off di default; la libreria li espone come property opt-in.
govpay.auth.basic.enabled=true
# Public chain: paths esposti senza autenticazione.
govpay.auth.public-chain.enabled=true
govpay.auth.public-chain.permit-all-paths[0].path=/auth/methods
govpay.auth.public-chain.permit-all-paths[0].methods[0]=GET
# Endpoint actuator (scrape Prometheus + health per le probe): il matcher e'
# per path (non per porta), ma sulla porta applicativa gli endpoint actuator
# non sono mappati (404): l'esposizione effettiva avviene solo sulla porta
# management. health anonimo risponde il solo status UP/DOWN (niente
# show-details): il dettaglio diagnostico resta non esposto.
govpay.auth.public-chain.permit-all-paths[1].path=/actuator/prometheus
govpay.auth.public-chain.permit-all-paths[1].methods[0]=GET
govpay.auth.public-chain.permit-all-paths[2].path=/actuator/health
govpay.auth.public-chain.permit-all-paths[2].methods[0]=GET

# -------------- OBSERVABILITY (Prometheus) ----------------
# Porta dedicata alle metriche: la porta applicativa non le serve mai;
# la protezione dell'endpoint di scrape e' demandata alla rete.
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
# Via web sono esposti il solo endpoint di scrape e health (per le probe
# di container/orchestratori) e loggers, da tenere su rete interna.
management.endpoints.web.exposure.include=health,prometheus,loggers
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s,2s,5s
# Tag comune per distinguere il servizio quando Prometheus raccoglie piu' app.
management.metrics.tags.application=govpay-riconciliazioni-api

riconciliazioni.time-zone=Europe/Rome
