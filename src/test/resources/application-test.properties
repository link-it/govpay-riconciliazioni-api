# Profilo di test: DB H2 in-memory.
# Attivato dai test JPA/integration con @ActiveProfiles("test").

spring.datasource.url=jdbc:h2:mem:riconciliazioni-api-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Porta management casuale: evita conflitti tra test e con servizi locali
management.server.port=0
